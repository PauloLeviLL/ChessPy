
[project]
name = "chesspy"
version = "0.1.0"
description = "Um jogo de xadrez em Python com interface gráfica."
requires-python = ">=3.13"
dependencies = [
    "pygame",
    "python-chess",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]